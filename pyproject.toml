[project]
name = "doctranslate"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "Flask>=3.0.0",
    "flask-cors>=4.0.0",
    "python-docx>=1.1.0",
    "transformers==4.51.3",
    "tokenizers>=0.21.0,<0.22.0",
    "sentencepiece>=0.2.0",
    "sacremoses",
    "indictranstoolkit>=1.1.1",
    "requests>=2.28.0",
    "gunicorn"
]

[tool.vercel]
entrypoint = "backend.app:app"